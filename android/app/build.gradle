import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barcepte.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.barcepte.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures { buildConfig true }

    sourceSets {
        main.assets.srcDirs = [layout.buildDirectory.dir('generated/webAssets')]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Start.io SDK - compileSdk 34 uyumlu stabil sürüm
    implementation 'com.startapp:inapp-sdk:5.1.0'
}




// Bundle the same reviewed files as desktop; stale checked-in copies are not used.
def webRoot = rootProject.projectDir.parentFile
def webAssets = new JsonSlurper().parse(new File(webRoot, 'web-assets.json'))
tasks.register('syncWebAssets', Sync) {
    from(webRoot) { include webAssets }
    into(layout.buildDirectory.dir('generated/webAssets'))
    doFirst {
        webAssets.each { asset ->
            if (!new File(webRoot, asset).isFile()) {
                throw new GradleException("Missing web asset: ${asset}")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('syncWebAssets') }
