name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee ../build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BarCepte-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk

  upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build legacy APK and current upgrade
        run: |
          mkdir -p /tmp/barcepte-legacy
          git archive eb64139b54e24849cd283b300f785f15d8e53d45 android | tar -x -C /tmp/barcepte-legacy
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('/tmp/barcepte-legacy/android/app/src/main/java/com/barcepte/app/MainActivity.java')
          s=p.read_text().replace('StartAppSDK.setTestAdsEnabled(false);','StartAppSDK.setTestAdsEnabled(true);').replace('startAppBanner.loadAd();','// Test fixture: no live ads.')
          p.write_text(s)
          PYCODE
          echo "sdk.dir=$ANDROID_HOME" > /tmp/barcepte-legacy/android/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          gradle -p /tmp/barcepte-legacy/android assembleDebug --no-daemon
          gradle -p android assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Verify installed-app upgrade and offline data migration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb install /tmp/barcepte-legacy/android/app/build/outputs/apk/debug/app-debug.apk
            adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.barcepte.app.LegacySeedTest com.barcepte.app.test/androidx.test.runner.AndroidJUnitRunner | tee legacy-seed.log
            grep -q 'OK (1 test)' legacy-seed.log
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am instrument -w -r -e class com.barcepte.app.UpgradeMigrationTest com.barcepte.app.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-test.log
            grep -q 'OK (1 test)' upgrade-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-upgrade-test-logs
          path: |
            legacy-seed.log
            upgrade-test.log
